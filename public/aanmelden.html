<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Account aanmaken · Essenza Tuinen</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',-apple-system,sans-serif}
    .font-h{font-family:'Poppins',sans-serif}
    [x-cloak]{display:none!important}
    .et-merk{background:
      radial-gradient(900px 520px at 18% 12%,rgba(11,157,70,.42) 0%,transparent 55%),
      radial-gradient(760px 520px at 85% 95%,rgba(143,217,168,.20) 0%,transparent 60%),
      linear-gradient(135deg,#2C3019 0%,#1F2113 58%,#141609 100%)}
    .et-kaart{animation:etIn .5s cubic-bezier(.2,.8,.2,1)}
    @keyframes etIn{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
    .et-in{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);color:#fff}
    .et-in::placeholder{color:rgba(255,255,255,.30)}
    .et-in:focus{outline:none;border-color:transparent;box-shadow:0 0 0 2px rgba(11,157,70,.6)}
    .et-in:disabled{color:rgba(255,255,255,.5);background:rgba(255,255,255,.03)}
    .et-btn{background:linear-gradient(135deg,#0B9D46,#087A37);transition:filter .15s,transform .05s}
    .et-btn:hover{filter:brightness(1.1)}.et-btn:active{transform:scale(.99)}
    .et-btn:disabled{opacity:.6;cursor:default}
    .et-chip{color:#8FD9A8;border:1px solid rgba(11,157,70,.45);background:rgba(11,157,70,.12)}
    .et-fout{background:rgba(254,226,226,.10);border:1px solid rgba(252,165,165,.35);color:#fca5a5}
    .et-punt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    /* Vingerafdruk die zich "aftekent" — maakt in één oogopslag duidelijk wat een passkey is */
    .vinger path{stroke-dasharray:120;stroke-dashoffset:120;animation:teken 1.6s ease forwards}
    .vinger path:nth-child(2){animation-delay:.12s}.vinger path:nth-child(3){animation-delay:.24s}
    .vinger path:nth-child(4){animation-delay:.36s}.vinger path:nth-child(5){animation-delay:.48s}
    @keyframes teken{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.vinger path{animation:none;stroke-dashoffset:0}.et-kaart{animation:none}}
  </style>
</head>
<body x-data="aanmelden()" x-init="init()" x-cloak class="min-h-screen bg-[#141609] text-white">
  <div class="min-h-screen grid lg:grid-cols-2">

    <!-- Merkpaneel -->
    <div class="et-merk relative hidden lg:flex flex-col justify-between p-12 overflow-hidden">
      <div class="relative z-10">
        <img src="/generated/essenza-tuinen/logo-white.png" alt="Essenza Tuinen" class="h-20 w-auto object-contain">
      </div>
      <div class="relative z-10 max-w-md">
        <h1 class="font-h text-5xl font-extrabold leading-[1.05] mb-5"
            x-text="stap==='passkey' ? 'Nog één ding.' : (stap==='wacht' ? 'Tot zo.' : (isReset ? 'Nieuw wachtwoord.' : 'Welkom bij het team.'))"></h1>
        <p class="text-white/55 leading-relaxed mb-8"
           x-text="stap==='passkey'
             ? 'Stel een passkey in, dan hoef je op dit apparaat nooit meer een wachtwoord te typen.'
             : (stap==='wacht'
               ? 'Je beheerder krijgt je aanmelding te zien en zet je account aan.'
               : 'Straks vul je hier je uren in, zie je je planning en weet je precies waar je morgen wordt verwacht.')"></p>
        <div class="flex flex-wrap gap-2.5">
          <span class="et-chip px-3.5 py-1.5 rounded-full text-sm">Uren invullen</span>
          <span class="et-chip px-3.5 py-1.5 rounded-full text-sm">Planning bekijken</span>
        </div>
      </div>
      <div class="relative z-10 text-white/35 text-sm">Hoveniersbedrijf · ontwerp, aanleg &amp; onderhoud</div>
    </div>

    <!-- Rechterkolom -->
    <div class="flex items-center justify-center p-8 bg-[#141609]">
      <div class="et-kaart w-full max-w-sm">
        <div class="lg:hidden mb-8">
          <img src="/generated/essenza-tuinen/logo-white.png" alt="Essenza Tuinen" class="h-14 w-auto object-contain">
        </div>

        <template x-if="laden">
          <p class="text-sm text-white/50 py-6">Even geduld…</p>
        </template>

        <!-- Link niet meer geldig -->
        <template x-if="!laden && stap==='ongeldig'">
          <div>
            <h2 class="font-h text-3xl font-extrabold mb-2">Link werkt niet meer</h2>
            <p class="text-white/50 text-sm mb-6" x-text="fout"></p>
            <a href="/inloggen" class="et-btn block text-center w-full py-3 rounded-xl font-bold text-white">Naar inloggen</a>
          </div>
        </template>

        <!-- Stap 1: account aanmaken -->
        <template x-if="!laden && stap==='formulier'">
          <form @submit.prevent="opslaan()">
            <h2 class="font-h text-3xl font-extrabold mb-1.5" x-text="isReset ? 'Nieuw wachtwoord' : 'Account aanmaken'"></h2>
            <p class="text-white/45 text-sm mb-8" x-text="isReset ? 'Kies hieronder een nieuw wachtwoord.' : 'Kies een wachtwoord, dan kun je meteen aan de slag.'"></p>

            <template x-if="isOpen">
              <div>
                <label class="block text-xs font-semibold text-white/60 mb-1.5">Je naam</label>
                <input class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" x-model="naam" autocomplete="name" required>
                <label class="block text-xs font-semibold text-white/60 mb-1.5">E-mailadres</label>
                <input type="email" class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" x-model="email" autocomplete="username" required>
                <label class="block text-xs font-semibold text-white/60 mb-1.5">Telefoon <span class="font-normal text-white/35">(optioneel)</span></label>
                <input class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" x-model="telefoon" autocomplete="tel">
              </div>
            </template>

            <template x-if="!isOpen">
              <div>
                <label class="block text-xs font-semibold text-white/60 mb-1.5">E-mailadres</label>
                <input class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" :value="email" disabled>
                <template x-if="!isReset">
                  <div>
                    <label class="block text-xs font-semibold text-white/60 mb-1.5">Je naam</label>
                    <input class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" x-model="naam" autocomplete="name" required>
                    <label class="block text-xs font-semibold text-white/60 mb-1.5">Telefoon <span class="font-normal text-white/35">(optioneel)</span></label>
                    <input class="et-in w-full px-4 py-3 mb-4 rounded-xl text-sm" x-model="telefoon" autocomplete="tel">
                  </div>
                </template>
              </div>
            </template>

            <label class="block text-xs font-semibold text-white/60 mb-1.5">Wachtwoord</label>
            <input type="password" class="et-in w-full px-4 py-3 mb-1 rounded-xl text-sm" x-model="pw" autocomplete="new-password" required>
            <p class="text-[11px] text-white/35 mb-4">Minimaal 10 tekens.</p>
            <label class="block text-xs font-semibold text-white/60 mb-1.5">Herhaal wachtwoord</label>
            <input type="password" class="et-in w-full px-4 py-3 mb-5 rounded-xl text-sm" x-model="pw2" autocomplete="new-password" required>

            <p x-show="fout" x-text="fout" class="et-fout text-sm rounded-lg px-3 py-2.5 mb-4"></p>
            <button class="et-btn w-full py-3 rounded-xl font-bold text-white shadow-lg" :disabled="busy"
                    x-text="busy?'Bezig…':(isReset?'Wachtwoord instellen':'Account aanmaken')"></button>
          </form>
        </template>

        <!-- Stap 2: passkey aanbieden -->
        <template x-if="!laden && stap==='passkey'">
          <div>
            <div class="w-full rounded-2xl p-6 mb-6 flex flex-col items-center text-center"
                 style="background:radial-gradient(420px 220px at 50% 0%,rgba(11,157,70,.22) 0%,transparent 70%);border:1px solid rgba(255,255,255,.08)">
              <svg class="vinger" width="76" height="76" viewBox="0 0 48 48" fill="none" stroke="#8FD9A8" stroke-width="2" stroke-linecap="round">
                <path d="M24 6c-7.7 0-14 6.3-14 14v6c0 5-1 9-3 12"/>
                <path d="M24 12c-4.4 0-8 3.6-8 8v6c0 6-1.5 10.5-4 14"/>
                <path d="M24 18c-1.1 0-2 .9-2 2v8c0 6.5-1.5 11.5-4 15"/>
                <path d="M30 20v8c0 5-.8 9.5-2.4 13.4"/>
                <path d="M36 22v6c0 3.4-.4 6.6-1.2 9.4"/>
              </svg>
              <p class="font-h font-bold text-lg mt-4">Wil je een passkey instellen?</p>
              <p class="text-white/55 text-sm mt-1.5 leading-relaxed">
                Met een passkey log je hier voortaan in met je <b class="text-white/80">vingerafdruk, gezicht of de pincode</b>
                van dit apparaat. Geen wachtwoord meer onthouden of intypen.
              </p>
            </div>

            <div class="space-y-2 mb-6">
              <div class="et-punt rounded-xl px-3.5 py-2.5 text-sm text-white/70">Sneller inloggen — één tik en je bent binnen.</div>
              <div class="et-punt rounded-xl px-3.5 py-2.5 text-sm text-white/70">Veiliger — de sleutel blijft op je eigen apparaat en is niet te raden.</div>
              <div class="et-punt rounded-xl px-3.5 py-2.5 text-sm text-white/70">Je wachtwoord blijft gewoon werken als reserve.</div>
            </div>

            <p x-show="fout" x-text="fout" class="et-fout text-sm rounded-lg px-3 py-2.5 mb-4"></p>
            <p x-show="!kanPasskey" class="text-sm text-white/45 mb-4">
              Dit apparaat of deze browser ondersteunt nog geen passkeys. Je kunt er later een instellen vanuit je dashboard.
            </p>

            <button x-show="kanPasskey" @click="passkeyToevoegen()" :disabled="busy"
                    class="et-btn w-full py-3 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>
              </svg>
              <span x-text="busy?'Bezig…':'Passkey toevoegen'"></span>
            </button>
            <button @click="naarDashboard()" class="w-full mt-2 py-2.5 rounded-xl font-semibold text-sm text-white/60 hover:text-white transition">
              Nu overslaan
            </button>
            <p class="text-[11px] text-white/35 text-center mt-3">Je kunt dit later altijd nog doen via <b>Mijn account</b> in het dashboard.</p>
          </div>
        </template>

        <!-- Account aangemaakt, wacht op goedkeuring van de beheerder -->
        <template x-if="!laden && stap==='wacht'">
          <div class="text-center">
            <div class="w-16 h-16 rounded-full mx-auto mb-4 grid place-items-center" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15)">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8FD9A8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            </div>
            <h2 class="font-h text-2xl font-extrabold mb-2">Bijna klaar</h2>
            <p class="text-white/55 text-sm leading-relaxed mb-6">
              Je account is aangemaakt. Je beheerder moet het nog goedkeuren — zodra dat gebeurd is,
              kun je inloggen met je e-mailadres en wachtwoord.
            </p>
            <a href="/inloggen" class="et-btn block text-center w-full py-3 rounded-xl font-bold text-white">Naar inloggen</a>
          </div>
        </template>

        <!-- Stap 3: gelukt -->
        <template x-if="!laden && stap==='gelukt'">
          <div class="text-center">
            <div class="w-16 h-16 rounded-full mx-auto mb-4 grid place-items-center" style="background:rgba(11,157,70,.18);border:1px solid rgba(11,157,70,.45)">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8FD9A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <h2 class="font-h text-2xl font-extrabold mb-1.5">Passkey ingesteld</h2>
            <p class="text-white/50 text-sm mb-6">De volgende keer log je in met één tik.</p>
            <button @click="naarDashboard()" class="et-btn w-full py-3 rounded-xl font-bold text-white">Naar het dashboard</button>
          </div>
        </template>
      </div>
    </div>
  </div>

<script src="/passkey.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function aanmelden(){return{
  laden:true, stap:'formulier', isReset:false, isOpen:false, token:'', email:'', naam:'', telefoon:'',
  pw:'', pw2:'', busy:false, fout:'', kanPasskey:false,

  async api(path,opts){ const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts));
    try{ return await r.json() }catch{ return {ok:false,error:'Serverfout ('+r.status+')'} } },

  async init(){
    this.kanPasskey = window.Passkey && Passkey.beschikbaar();
    const q=new URLSearchParams(location.search);
    this.token=q.get('token')||'';
    // Vanuit de eerste inrichting kom je hier al ingelogd binnen, alleen voor de passkey-stap.
    if(!this.token && q.get('passkey')==='1'){
      const s=await this.api('/api/session');
      this.laden=false;
      if(s&&s.authed){ this.stap='passkey'; return; }
      this.stap='ongeldig'; this.fout='Je bent niet ingelogd.'; return;
    }
    if(!this.token){ this.laden=false; this.stap='ongeldig'; this.fout='Er ontbreekt een uitnodigingscode in de link.'; return; }
    const d=await this.api('/api/aanmelden?token='+encodeURIComponent(this.token));
    this.laden=false;
    if(!d.ok){ this.stap='ongeldig'; this.fout=d.error||'Deze link is niet meer geldig.'; return; }
    this.isReset=d.soort==='reset'; this.isOpen=d.soort==='open';
    this.email=d.email||''; this.naam=d.naam||'';
  },

  async opslaan(){
    this.fout='';
    if(this.pw.length<10) return this.fout='Kies een wachtwoord van minimaal 10 tekens.';
    if(this.pw!==this.pw2) return this.fout='De twee wachtwoorden zijn niet gelijk.';
    this.busy=true;
    const d=await this.api('/api/aanmelden',{method:'POST',body:JSON.stringify({
      token:this.token, naam:this.naam, email:this.email, telefoon:this.telefoon, password:this.pw })});
    this.busy=false;
    if(!d.ok) return this.fout=d.error||'Er ging iets mis.';
    this.fout='';
    // Via een deelbare link moet de beheerder het account eerst goedkeuren;
    // dan is er nog geen sessie en dus ook geen passkey-stap.
    this.stap = d.wacht ? 'wacht' : 'passkey';
  },

  async passkeyToevoegen(){
    this.busy=true; this.fout='';
    const d=await Passkey.registreer('');
    this.busy=false;
    if(d.ok) return this.stap='gelukt';
    this.fout=d.error||'Het instellen van de passkey is niet gelukt.';
  },

  naarDashboard(){ location.href='/admin'; },
}}
</script>
</body>
</html>
