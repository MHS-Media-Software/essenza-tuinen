<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Account aanmaken · Essenza Tuinen</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;color:#1F2113;background:linear-gradient(135deg,#1F2113,#2C3019);min-height:100vh}
    .font-h{font-family:'Poppins',sans-serif}
    [x-cloak]{display:none!important}
    .card{background:#fff;border-radius:1.1rem;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .inp{width:100%;padding:.7rem .85rem;border:1px solid #E6E8DC;border-radius:.65rem;font-size:.95rem;outline:none;background:#fff}
    .inp:focus{border-color:#0B9D46;box-shadow:0 0 0 3px rgba(11,157,70,.12)}
    .inp:disabled{background:#F5F7EE;color:#6B7060}
    .lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6B7060}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;border-radius:.7rem;transition:all .15s;font-size:.9rem;cursor:pointer;width:100%;padding:.75rem 1.1rem}
    .btn-primary{background:#0B9D46;color:#fff}.btn-primary:hover{background:#087A37}
    .btn-primary:disabled{opacity:.6;cursor:default}
    .melding{font-size:.82rem;padding:.6rem .75rem;border-radius:.55rem;background:#fbe4e4;color:#8d2b20}
  </style>
</head>
<body x-data="aanmelden()" x-init="init()" x-cloak class="flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="card p-8">
      <img src="/favicon.png" class="w-14 h-14 rounded-2xl mx-auto mb-4" alt="">

      <template x-if="laden">
        <p class="text-center text-sm py-6" style="color:#6B7060">Even geduld…</p>
      </template>

      <!-- Ongeldige of verlopen link -->
      <template x-if="!laden && !geldig">
        <div class="text-center">
          <h1 class="font-h text-lg font-bold mb-2">Link werkt niet meer</h1>
          <p class="text-sm mb-5" style="color:#6B7060" x-text="fout"></p>
          <a href="/inloggen" class="btn btn-primary">Naar inloggen</a>
        </div>
      </template>

      <!-- Account aanmaken of nieuw wachtwoord instellen -->
      <template x-if="!laden && geldig">
        <form @submit.prevent="opslaan()">
          <h1 class="font-h text-xl font-bold text-center mb-1" x-text="isReset ? 'Nieuw wachtwoord' : 'Welkom bij Essenza Tuinen'"></h1>
          <p class="text-center text-sm mb-6" style="color:#6B7060"
             x-text="isReset ? 'Kies hieronder een nieuw wachtwoord.' : 'Kies een wachtwoord, dan kun je meteen aan de slag.'"></p>

          <label class="lbl">E-mailadres</label>
          <input class="inp mt-1 mb-3" :value="email" disabled>

          <template x-if="!isReset">
            <div>
              <label class="lbl">Je naam</label>
              <input class="inp mt-1 mb-3" x-model="naam" autocomplete="name" required>
              <label class="lbl">Telefoon <span class="normal-case font-normal">(optioneel)</span></label>
              <input class="inp mt-1 mb-3" x-model="telefoon" autocomplete="tel">
            </div>
          </template>

          <label class="lbl">Wachtwoord</label>
          <input type="password" class="inp mt-1 mb-1" x-model="pw" autocomplete="new-password" required>
          <p class="text-[11px] mb-3" style="color:#6B7060">Minimaal 10 tekens.</p>
          <label class="lbl">Herhaal wachtwoord</label>
          <input type="password" class="inp mt-1 mb-4" x-model="pw2" autocomplete="new-password" required>

          <p x-show="fout" x-text="fout" class="melding mb-3"></p>
          <button class="btn btn-primary" :disabled="busy" x-text="busy?'Bezig…':(isReset?'Wachtwoord instellen':'Account aanmaken')"></button>
        </form>
      </template>
    </div>
    <p class="text-center text-xs mt-5" style="color:rgba(255,255,255,.5)">Essenza Tuinen · werkomgeving</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function aanmelden(){return{
  laden:true, geldig:false, isReset:false, token:'', email:'', naam:'', telefoon:'',
  pw:'', pw2:'', busy:false, fout:'',

  async api(path,opts){ const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts));
    try{ return await r.json() }catch{ return {ok:false,error:'Serverfout ('+r.status+')'} } },

  async init(){
    this.token=new URLSearchParams(location.search).get('token')||'';
    if(!this.token){ this.laden=false; this.fout='Er ontbreekt een uitnodigingscode in de link.'; return; }
    const d=await this.api('/api/aanmelden?token='+encodeURIComponent(this.token));
    this.laden=false;
    if(!d.ok){ this.fout=d.error||'Deze link is niet meer geldig.'; return; }
    this.geldig=true; this.isReset=d.soort==='reset';
    this.email=d.email; this.naam=d.naam||'';
  },

  async opslaan(){
    this.fout='';
    if(this.pw.length<10) return this.fout='Kies een wachtwoord van minimaal 10 tekens.';
    if(this.pw!==this.pw2) return this.fout='De twee wachtwoorden zijn niet gelijk.';
    this.busy=true;
    const d=await this.api('/api/aanmelden',{method:'POST',body:JSON.stringify({
      token:this.token, naam:this.naam, telefoon:this.telefoon, password:this.pw })});
    this.busy=false;
    if(d.ok) location.href='/admin'; else this.fout=d.error||'Er ging iets mis.';
  },
}}
</script>
</body>
</html>
